name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: PROYECTO BARBERIA CAMILO
      - name: Publicar el sitio
        id: publicar
        uses: actions/deploy-pages@v4
